<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC対策クイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>TOEIC対策クイズ</h1>
  <p class="sub">Part 5 形式の短文穴埋め問題</p>
</header>
<main>
  <section id="menu">
    <h2>出題範囲</h2>
    <div class="choices" id="catChoices">
      <button data-cat="all" class="active">すべて</button>
      <button data-cat="grammar">文法</button>
      <button data-cat="vocab">語彙</button>
      <button data-cat="prep">前置詞・接続詞</button>
      <button data-cat="wrong">間違えた問題</button>
    </div>
    <label class="count">出題数:
      <select id="count"><option>5</option><option selected>10</option><option>20</option></select>
    </label>
    <button id="start" class="primary">スタート</button>
    <p id="stats" class="stats"></p>
  </section>

  <section id="quiz" hidden>
    <p id="progress" class="progress"></p>
    <p id="question" class="question"></p>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback" hidden>
      <p id="result"></p>
      <p id="explain"></p>
      <button id="next" class="primary">次へ</button>
    </div>
  </section>

  <section id="result-view" hidden>
    <h2>結果</h2>
    <p id="score" class="score"></p>
    <button id="retry" class="primary">もう一度</button>
    <button id="back">メニューへ</button>
  </section>
</main>
<script src="data/questions.js"></script>
<script src="app.js"></script>
</body>
</html>
